<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그룹 초대 · 시공간 다이어리</title>
  <meta name="description" content="시공간 다이어리 그룹 초대 링크입니다. 앱이 설치돼 있으면 앱이 열리고, 없으면 이 페이지에서 초대 코드를 확인할 수 있습니다.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light dark;
      --surface: #f1f6fd;
      --surface-card: #ffffff;
      --ink: #1b2635;
      --body: #48586f;
      --muted: #7688a3;
      --blue: #3d6fd6;
      --line: rgba(61, 111, 214, 0.16);
      --radius: 1.25rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #10161f;
        --surface-card: #18212e;
        --ink: #eaf1fb;
        --body: #b3c2d6;
        --muted: #8496ad;
        --line: rgba(119, 171, 242, 0.22);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
      background: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 27rem;
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(1.5rem, 5vw, 2.25rem);
      box-shadow: 0 10px 30px rgba(27, 38, 53, 0.1);
    }
    h1 {
      font-size: clamp(1.35rem, 4vw, 1.7rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p { color: var(--body); margin-top: 0.85rem; }
    .code-label {
      display: block;
      margin-top: 1.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .code {
      margin-top: 0.4rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(1.6rem, 7vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--blue);
      word-break: break-all;
    }
    .store {
      display: block;
      margin-top: 1.75rem;
      padding: 0.9rem 1.25rem;
      border-radius: 0.85rem;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: transform 140ms cubic-bezier(0.16, 1, 0.3, 1), opacity 140ms;
    }
    .store:hover { transform: translateY(-1px); opacity: 0.93; }
    .store:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .note { margin-top: 1.25rem; font-size: 0.88rem; color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>그룹 초대</h1>
    <p>
      시공간 다이어리 앱이 설치돼 있으면 이 링크가 <strong>앱에서 바로</strong> 열립니다.
      이 화면이 보인다면 앱이 아직 없거나, 브라우저가 링크를 직접 연 것입니다.
    </p>

    <section id="code-box" hidden aria-labelledby="code-label">
      <span class="code-label" id="code-label">초대 코드</span>
      <!-- 코드는 주소에 실려 온다. 앱을 설치한 뒤 이 코드를 직접 넣으면 같은 그룹으로 들어간다. -->
      <p class="code" id="code"></p>
    </section>

    <a class="store" id="store"
       href="https://play.google.com/store/apps/details?id=com.romanticrider.spacetime">
      Google Play 에서 설치하기
    </a>

    <p class="note">
      설치한 뒤 이 링크를 다시 누르거나, 앱의 <em>그룹 &gt; 초대 코드 입력</em>에 위 코드를 넣어 주세요.
      초대 코드는 발급 후 7일이 지나면 만료됩니다.
    </p>
  </main>

  <script>
    // 🔴 초대 코드를 싣는 키는 **`invite`** 다. `code` 가 아니다 (SI-89).
    //
    //    `code` 는 OAuth/PKCE 가 인가 코드에 쓰는 이름이라, 앱의 Supabase 딥링크
    //    핸들러가 이 링크를 **로그인 콜백으로 오인**한다 — 링크를 열 때마다
    //    AuthException 이 나고 설정 화면이 떠 있으면 "로그인이 완료되지 않았어요"
    //    라는 **거짓 안내**까지 뜬다(개발 실측). 예약어를 피하는 것이 요점이므로
    //    `token`·`token_hash`·`state`·`type` 도 쓰지 말 것.
    //
    //    ⚠️ 옛 `code` 링크는 **읽어는 준다**(이 페이지는 앱이 아니라서 충돌이
    //    없다). 다만 **새로 만들지 않는다** — 옛 링크를 앱이 있는 기기에서 열면
    //    위 거짓 안내가 그대로 난다. 관용은 «이미 보낸 문자»를 위한 것이다.
    const params = new URLSearchParams(location.search);
    const raw = params.get('invite') || params.get('code') || '';
    const code = raw.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);

    if (code) {
      // 코드는 화면에 보여 주기만 한다 — 어디로도 보내지 않는다.
      // (innerText 로 넣는다. innerHTML 을 쓰면 주소가 곧 스크립트 주입 통로다.)
      document.getElementById('code').textContent = code;
      document.getElementById('code-box').hidden = false;

      // 설치 후에도 코드가 따라가도록 Play 링크에 referrer 를 싣는다.
      //
      // ✅ **읽는 쪽이 앱에 있다** — `install_referrer_invite.dart`(SP-233 디퍼드
      //    딥링크)가 첫 기동에서 한 번 읽고 버린다. 그 파서는 `&` 로 끊어
      //    **`invite=CODE` 쌍만** 찾으므로 아래처럼 utm 이 섞여도 된다
      //    (파서 주석이 그 형태를 명시한다).
      // 🔴 **키 이름은 `invite` 로 고정**이다(앱 `GroupLinks.referrerKey`).
      //    바꾸면 설치 후 자동 합류가 **조용히** 끊긴다 — 실패가 전부 조용한
      //    경로라 아무도 모른다.
      // ⚠️ referrer 는 **Play 를 거쳐 설치될 때만** 온다. 사이드로드·APK 직접
      //    설치에는 안 오므로, 코드를 사람이 읽고 넣는 경로가 정본이다.
      //
      // 🔴 **이 문자열 형식은 앱 시험이 대조하고 있다** (spacetime 레포의 referrer
      //    왕복 시험 — 2026-09-28 SI-89). 앱이 자기 상수로 만든 값을 자기 파서에
      //    먹이던 것을 **여기서 나가는 실제 형식**으로 바꿨기 때문이다(베낀 값끼리
      //    맞춰 보는 것은 계약 검증이 아니다).
      //    ⇒ **형식을 바꾸려면 바꾸기 전에 앱 쪽에 알릴 것.** 통지 없이 바꾸면
      //    저쪽 시험이 먼저 붉어지고, 그쪽 사람은 «우리 파서가 깨졌다»로 읽어
      //    엉뚱한 곳을 판다. 키 순서는 계약이 아니다(파서가 `&` 로 끊어 `invite`
      //    만 찾는다) — 그래도 괜히 흔들지 않는다.
      const store = document.getElementById('store');
      const referrer = encodeURIComponent(
        'utm_source=spacetime_invite&utm_medium=link&invite=' + code,
      );
      store.href =
        'https://play.google.com/store/apps/details?id=com.romanticrider.spacetime'
        + '&referrer=' + referrer;
    }
  </script>
</body>
</html>
